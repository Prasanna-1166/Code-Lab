<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Code Library</title>
  <meta name="description" content="Official repository for lab exam programs: clean, verified source code ready to read, search, copy and download.">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand-wrapper">
      <div class="brand-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <div class="brand-text">
        <h1>
          <span>Lab Code Library</span>
          <span class="status-badge"><span class="pulse-dot"></span> Live Hub</span>
        </h1>
        <p>Curated lab exam programs — verified, syntax-highlighted, ready to copy &amp; download.</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn" id="theme-toggle" aria-pressed="false" title="Toggle theme">Dark theme</button>
      <a href="/admin" class="btn btn-small" title="Manage experiments">Admin Portal</a>
    </div>
  </header>

  <main>
    <div class="controls-wrapper">
      <div class="controls" role="search">
        <div>
          <label for="search">Search programs</label>
          <div class="search-field-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="search" type="search" placeholder="Search by experiment #, title, keyword or syntax..." autocomplete="off">
            <button type="button" id="search-clear" class="search-clear-btn" aria-label="Clear search" title="Clear">✕</button>
          </div>
        </div>
        <div>
          <label for="subject">Lab subject</label>
          <select id="subject"><option value="">All subjects</option></select>
        </div>
        <div>
          <label for="language">Language</label>
          <select id="language"><option value="">All languages</option></select>
        </div>
      </div>

      <div class="results-bar">
        <span class="result-count-badge" id="result-badge">Loading repository...</span>
        <p class="sr-only" id="result-count" role="status" aria-live="polite"></p>
      </div>
    </div>

    <div class="layout" id="layout">
      <section class="list-pane" id="list-pane" aria-label="Experiments"></section>
      <section class="viewer-pane" id="viewer-pane" aria-label="Program viewer"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-meta">
      <strong>Lab Code Library</strong> &bull; Production Ready &bull; Fast, secure &amp; lightweight
    </div>
    <div>
      <a href="/admin">Administrator sign in &rarr;</a>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
