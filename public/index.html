<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Code Library</title>
  <meta name="description" content="Search, review, copy, and download verified source code for lab exam experiments.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-brand">
      <div class="brand-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <div class="brand-title">
        <h1>Lab Code Library</h1>
        <p>Lab exam programs — search, review, copy, and download.</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn btn-small" id="theme-toggle" aria-pressed="false" title="Toggle color theme">Dark theme</button>
      <a href="/admin" class="btn btn-small" title="Manage programs">Manage programs</a>
    </div>
  </header>

  <main>
    <div class="controls-bar">
      <div class="controls-inner">
        <div class="controls" role="search">
          <div class="control-field">
            <label for="search">Search</label>
            <div class="search-input-wrap">
              <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input id="search" type="search" placeholder="Experiment #, title, keyword or syntax..." autocomplete="off">
              <button type="button" id="search-clear" class="search-clear-btn" aria-label="Clear search" title="Clear">✕</button>
            </div>
          </div>
          <div class="control-field">
            <label for="subject">Lab subject</label>
            <select id="subject"><option value="">All subjects</option></select>
          </div>
          <div class="control-field">
            <label for="language">Language</label>
            <select id="language"><option value="">All languages</option></select>
          </div>
        </div>
        <div class="controls-meta">
          <span id="result-status">Loading experiments...</span>
          <p class="sr-only" id="result-count" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <div class="layout" id="layout">
      <section class="list-pane" id="list-pane" aria-label="Experiments"></section>
      <section class="viewer-pane" id="viewer-pane" aria-label="Program viewer"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div>Lab Code Library &bull; Curated exam programs</div>
    <div><a href="/admin">Administrator &amp; local management &rarr;</a></div>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
